function segAt(t) { for (const s of SEGS) if (t >= s.t0 && t < s.t1) return s; return SEGS[SEGS.length - 1]; }
function key(t) {
  const s = segAt(t); if (s.kind !== 'shot') return null;
  return s.p + String(Math.max(0, (s.from || 0) + Math.floor((t - s.t0) * FPS * (s.sp || 1)))).padStart(3, '0');

function want(t) {

const CW = W / 40, CH = H / 24, SAFE = 0.84, SAFE_X = 0.08, SAFE_Y = 0.095;     // страница телетекста — с полями, как на телевизоре
const TC = { w: '#f2f2f2', y: '#f4f000', c: '#00f0f0', g: '#00e000', m: '#f000f0', r: '#f01010', b: '#1010f0', k: '#000' };
function tt(g, col, row, text, fg, o) {
  o = o || {};
  const hh = o.dbl ? 2 : 1;
  if (o.bg) { g.fillStyle = TC[o.bg]; g.fillRect(col * CW, row * CH, (o.w || text.length) * CW, CH * hh); }
  if (o.flash && Math.floor(o.t * 2.2) % 2 === 0) return;
  g.save(); g.translate(col * CW, row * CH); g.scale(o.sx || 1, hh);
  g.font = `bold ${Math.round(CH * 0.92)}px ${MONO}`; g.textBaseline = 'top'; g.textAlign = 'left'; g.fillStyle = TC[fg] || fg;
  for (let i = 0; i < text.length; i++) g.fillText(text[i], i * CW / Math.max(1, o.sx || 1) + CW * 0.12, CH * 0.08);     // узкий текст (sx < 1) идёт плотнее, широкий — в те же знакоместа
  g.restore();
}
function mosaic(g, col, row, rows, fg) {          // блочная графика: строки из # — закрашенные половинки знакомест
  g.fillStyle = TC[fg];
  rows.forEach((r, j) => { for (let i = 0; i < r.length; i++) if (r[i] === '#') g.fillRect(col * CW + i * CW / 2, row * CH + j * CH / 2, CW / 2 + .5, CH / 2 + .5); });
}
function header(g, page, t) {
  const ss = String(7 + Math.floor(t) % 53).padStart(2, '0');
  tt(g, 0, 0, 'P' + page, 'g'); tt(g, 6, 0, 'ОБЛАКО-ТЕЛЕТЕКСТ', 'w'); tt(g, 24, 0, String(page), 'y'); tt(g, 28, 0, 'Сб19янв', 'c');
  tt(g, 32, 1, '03:14:' + ss, 'w');
}
function keys(g) {
  tt(g, 0, 23, ' Эфир    ', 'k', { bg: 'r' }); tt(g, 10, 23, ' Займы   ', 'k', { bg: 'g' }); tt(g, 20, 23, ' Работа  ', 'k', { bg: 'y' }); tt(g, 30, 23, ' Ночь    ', 'k', { bg: 'c' });
}

    L.forEach((l, i) => { if (show(i + 1)) { tt(g, 2, 9 + i * 2, l[0], l[2], { flash: i === 2 && u > 3.4, t }); tt(g, 31, 9 + i * 2, l[1], 'c'); } });

    tick.onaudioprocess = e => { if (tick.done) return; const d = e.inputBuffer.getChannelData(0), si = Math.floor(ac.currentTime - T0);
      if (si >= 0) { let m = pk[si] || 0, q = sq[si] || 0; for (let i = 0; i < d.length; i++) { const v = Math.abs(d[i]); if (v > m) m = v; q += v * v; } pk[si] = m; sq[si] = q; cnt[si] = (cnt[si] || 0) + d.length; }
      loop(); };
    const zg = ac.createGain(); zg.gain.value = 0; tick.connect(zg); zg.connect(ac.destination);
    const _res = res; res = () => { tick.done = 1; tick.disconnect(); _res(); };
    loop();
  });
  rec.stop(); await done;
  const ext = mime.startsWith('video/mp4') ? 'mp4' : 'webm';
  const blob = new Blob(chunks, { type: mime });
  const r = await fetch('/__save?name=trailer-mini-raw.' + ext, { method: 'PUT', body: blob });
  const db = v => v > 0 ? Math.round(20 * Math.log10(v)) : -99;
  return { info, mime, frames, missing, missK, dropped: slow, mb: +(blob.size / 1048576).toFixed(1), saved: await r.text(),
    peak: pk.map(db).join(' '), rms: sq.map((q, i) => db(Math.sqrt(q / cnt[i]))).join(' ') };
}
window.record = record;
